<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재고">
<meta name="theme-color" content="#F6F7F9">
<title>재고</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F6F7F9; --card: #FFFFFF; --line: #E6E8ED; --line2: #D9DCE3;
    --ink: #16181D; --ink2: #3D4350; --mute: #5B6270;
    --blue: #2457D6; --blue-ink: #1D46AD; --blue-bg: #E3EBFB;
    --orange-ink: #8A3D06; --orange-bg: #FBE9D7; --orange: #C25E0B;
    --gray-bg: #EEF0F4; --red: #B42318;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif; font-size: 15px;
    overflow-x: hidden; touch-action: pan-y; -webkit-text-size-adjust: 100%; overscroll-behavior-x: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); }
  .page { flex: 1; padding: 16px 20px calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: center; gap: 4px; min-height: 52px; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
  .big h1 { font-size: 26px; letter-spacing: -0.5px; }
  .sub { margin: 2px 0 0; font-size: 13px; color: var(--mute); }
  .icon-btn { width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--mute); font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); }
  .input { height: 46px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 10px; background: #fff; font-size: 16px; color: var(--ink); width: 100%; }
  textarea.input { height: 80px; padding: 10px 12px; resize: vertical; }
  /* 아이폰 날짜 칸이 카드 밖으로 넘치지 않게 */
  input.input[type=date] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; text-align: left; line-height: 44px; }
  input.input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .pill { height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line2); background: #fff; color: var(--ink);
    font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .sell-btn { height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--blue); color: #fff;
    font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .sell-btn:disabled { opacity: .5; cursor: default; }
  .sq-btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--blue); background: #fff; color: var(--blue-ink);
    font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .pill.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pill.text { border-color: transparent; background: transparent; color: var(--blue-ink); padding: 0 6px; }
  .search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #fff; border: 1px solid var(--line2); border-radius: 12px; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; min-width: 0; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
  .seg button { height: 42px; border: 0; border-radius: 9px; background: transparent; color: var(--ink2); font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 700; }
  .chips { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
  .locs { display: flex; flex-wrap: wrap; gap: 8px; }
  .locs .chip { padding: 0 14px; height: 38px; }
  .loc-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
  .chip { height: 40px; padding: 0 4px; border: 1px solid var(--line2); border-radius: 20px; background: #fff; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 500; }
  .btn { height: 52px; border: 0; border-radius: 14px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.sm { height: 44px; font-size: 14px; border-radius: 10px; }
  .btn.line { background: #fff; color: var(--ink); border: 1px solid var(--line2); font-weight: 500; }
  .btn.ghost { background: transparent; color: var(--blue-ink); font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; }
  .badge { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .b-blue { background: var(--blue-bg); color: var(--blue-ink); }
  .b-orange { background: var(--orange-bg); color: var(--orange-ink); }
  .b-gray { background: var(--gray-bg); color: var(--ink2); }
  .b-dark { background: var(--ink); color: #fff; }
  .b-red { background: #FDECEA; color: var(--red); }
  .photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .photos button { padding: 0; border: 2px solid transparent; border-radius: 10px; background: var(--line); aspect-ratio: 1; overflow: hidden; cursor: pointer; position: relative; }
  .photos button.on { border-color: var(--blue); }
  .photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photos .tag { position: absolute; left: 4px; top: 4px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 5px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; width: 100%; text-align: left; }
  .thumb { width: 60px; height: 60px; border-radius: 10px; background: var(--line); flex-shrink: 0; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--mute); overflow: hidden; }
  .title { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qty { font-size: 15px; font-weight: 700; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line2); border-radius: 10px; height: 44px; background: #fff; flex-shrink: 0; }
  .stepper button { width: 42px; height: 42px; border: 0; background: transparent; font-size: 20px; cursor: pointer; }
  .stepper span { min-width: 30px; text-align: center; font-weight: 700; }
  .hero { width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; background: #DDE0E6; object-fit: cover; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 10px; border-radius: 10px; background: var(--bg); }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 12px; color: var(--mute); }
  .empty { text-align: center; color: var(--mute); font-size: 14px; padding: 40px 0; }
  .err { color: var(--red); font-size: 13px; }
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
  nav.bottom .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  nav.bottom button { height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--mute); cursor: pointer; }
  nav.bottom button.on { color: var(--blue-ink); font-weight: 700; }
  .pick-row { display: flex; align-items: center; gap: 12px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; width: 100%; text-align: left; cursor: pointer; }
  .pick-row.on { border-color: var(--blue); background: #F4F7FE; }
  .pick-row .thumb { width: 48px; height: 48px; }
  .check { width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--line2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; }
  .pick-row.on .check { background: var(--blue); border-color: var(--blue); }
  .preview { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--line); }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 12px 16px; border-radius: 12px; font-size: 14px; width: max-content; max-width: calc(100% - 40px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  #toast.show { opacity: 1; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  pre.debug { background: var(--bg); padding: 10px; border-radius: 10px; font-size: 11px; overflow-x: hidden; white-space: pre-wrap; word-break: break-all; margin: 0; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="page"><p class="muted">불러오는 중…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // 확대 막기: 두 손가락 확대, 사파리 제스처 (두 번 탭 확대는 CSS touch-action 으로 막음)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  const cfg = window.INV_CONFIG || {};
  const $app = document.getElementById('app');

  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('여기에')) {
    $app.innerHTML = '<div class="page"><div class="card"><b>설정이 필요해요</b><p class="muted">config.js 에 Supabase 주소와 anon 키를 넣어 주세요.</p></div></div>';
    return;
  }

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // ------------------------------------------------------------------
  // 상태
  // ------------------------------------------------------------------
  const S = {
    session: null, me: null, members: [], items: [],
    view: 'list', itemId: null,
    filter: { owner: 'all', status: 'active', q: '', loc: '', locOwner: '' },
    authTab: 'login', authMsg: '', authErr: '',
    runs: [],
    moveQ: '', moveQty: {}, transfers: [],
    locate: { owner: '', place: '', photo: '', list: [], sel: [], unknown: [], matched: false, error: '', q: '' },
    busy: false,
  };

  // ------------------------------------------------------------------
  // 도움 함수
  // ------------------------------------------------------------------
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function won(n) { return n == null ? '가격 없음' : (n === 0 ? '나눔' : Number(n).toLocaleString('ko-KR') + '원'); }
  function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  // 로그인한 사람을 먼저, 그다음 다른 한 사람
  function membersMeFirst() {
    const meId = S.me && S.me.user_id;
    return [...S.members].sort((a, b) => (a.user_id === meId ? -1 : 0) - (b.user_id === meId ? -1 : 0));
  }
  function ownerName(uid) {
    if (!uid) return '공금';
    const m = S.members.find(x => x.user_id === uid);
    return m ? m.display_name : '알 수 없음';
  }
  function ago(iso) {
    if (!iso) return '아직 안 함';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return '방금 전';
    if (s < 3600) return Math.floor(s / 60) + '분 전';
    if (s < 86400) return Math.floor(s / 3600) + '시간 전';
    return Math.floor(s / 86400) + '일 전';
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function errMsg(e) {
    const m = (e && (e.message || e.error_description || e.error)) || String(e);
    if (/Invalid login credentials/i.test(m)) return '이메일이나 비밀번호가 맞지 않아요';
    if (/Email not confirmed/i.test(m)) return '메일함에서 인증 링크를 먼저 눌러 주세요';
    if (/User already registered/i.test(m)) return '이미 가입된 이메일이에요. 로그인해 주세요';
    if (/Password should be/i.test(m)) return '비밀번호는 6자 이상이어야 해요';
    if (/duplicate key|inv_items_article_owner_uniq/i.test(m)) return '같은 판매글의 물건이 그 주인에게 이미 있어요';
    return m;
  }
  function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function fmtYMD(s) { return s ? s.replace(/-/g, '.') : ''; }
  // 소비기한 정보: 6개월 안이면 임박
  function expiryInfo(it) {
    if (!it.expiry_date) return null;
    const d = new Date(it.expiry_date + 'T00:00:00'), t = today0();
    const days = Math.round((d - t) / 86400000);
    const limit = new Date(t); limit.setMonth(limit.getMonth() + 6);
    return { days, expired: days < 0, soon: d <= limit };
  }
  function isSoon(it) { const e = expiryInfo(it); return !!(e && e.soon); }
  function expiryBadge(it, always = false) {
    const e = expiryInfo(it);
    if (!e) return '';
    if (e.expired) return '<span class="badge b-red">기한 지남</span>';
    if (e.soon) return `<span class="badge b-orange">임박 D-${e.days}</span>`;
    return always ? `<span class="badge b-gray">D-${e.days}</span>` : '';
  }
  function statusBadge(it) {
    if (it.status === '판매완료') return '<span class="badge b-gray">판매완료</span>';
    if (it.status === '예약중') return '<span class="badge b-orange">예약중</span>';
    return '<span class="badge b-blue">판매중</span>';
  }
  function thumb(it, cls = 'thumb') {
    return it.image_url
      ? `<img class="${cls}" src="${esc(it.image_url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls}',textContent:'사진 없음'}))">`
      : `<div class="${cls}">사진 없음</div>`;
  }
  const ICON = {
    back: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    search: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    box: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
    move: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    sync: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg>',
    receipt: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17l-3.5-2-3.5 2-3.5-2L5 21z"/><path d="M9 9h6M9 13h6"/></svg>',
    out: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  };

  // ------------------------------------------------------------------
  // 데이터
  // ------------------------------------------------------------------
  async function loadMembers() {
    const { data, error } = await sb.from('inv_members').select('*').order('created_at');
    if (error) throw error;
    S.members = data || [];
  }
  async function loadItems() {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('inv_items').select('*')
        .neq('status', '숨김').order('updated_at', { ascending: false }).range(from, from + 999);
      if (error) throw error;
      all.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
    S.items = all;
  }
  async function loadAll() {
    await Promise.all([loadMembers(), loadItems()]);
  }

  async function afterLogin() {
    const { data, error } = await sb.rpc('inv_join', { p_full_name: null });
    if (error) {
      S.authErr = errMsg(error);
      await sb.auth.signOut();
      S.session = null;
      return render();
    }
    S.me = data;
    S.filter.owner = data.user_id; // 홈은 내 물건부터
    try { await loadAll(); } catch (e) { toast(errMsg(e)); }
    render();
  }

  // ------------------------------------------------------------------
  // 화면: 로그인 · 가입
  // ------------------------------------------------------------------
  function viewAuth() {
    const signup = S.authTab === 'signup';
    return `<div class="page" style="padding-bottom: 40px; justify-content: center;">
      <div class="top big" style="flex-direction: column; align-items: flex-start;">
        <h1>재고</h1><p class="sub">당근 판매 물건 재고 관리</p>
      </div>
      <div class="seg" role="group" aria-label="로그인 또는 가입">
        <button class="${signup ? '' : 'on'}" onclick="App.authTab('login')">로그인</button>
        <button class="${signup ? 'on' : ''}" onclick="App.authTab('signup')">가입</button>
      </div>
      <form class="card" onsubmit="event.preventDefault(); App.${signup ? 'signup' : 'login'}(this)">
        ${signup ? `<label class="field">이름 (예: 홍길동 → 앱에는 '길동'으로 보여요)
          <input class="input" name="name" autocomplete="name" required></label>` : ''}
        <label class="field">이메일
          <input class="input" name="email" type="email" autocomplete="email" required></label>
        <label class="field">비밀번호${signup ? ' (6자 이상)' : ''}
          <input class="input" name="password" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" minlength="6" required></label>
        ${S.authErr ? `<p class="err" style="margin:0">${esc(S.authErr)}</p>` : ''}
        ${S.authMsg ? `<p class="muted" style="margin:0">${esc(S.authMsg)}</p>` : ''}
        <button class="btn" type="submit" ${S.busy ? 'disabled' : ''}>${signup ? '가입하기' : '로그인'}</button>
      </form>
      ${signup ? '<p class="muted" style="margin:0; text-align:center;">먼저 가입한 2명만 이 앱을 쓸 수 있어요.</p>' : ''}
    </div>`;
  }

  // ------------------------------------------------------------------
  // 화면: 재고 목록
  // ------------------------------------------------------------------
  // 보관 위치 목록 (판매 중인 물건 기준, 숫자는 자연스러운 순서로)
  // 보관 위치는 A님 / B님 / 공금이 각자 따로 가짐 (ownerKey: 사람 id 또는 'shared')
  function ownerKey(it) { return it.owner_user || 'shared'; }
  function ownerKeyName(k) { return k === 'shared' ? '공금' : ownerName(k); }
  function locations(ok) {
    const set = new Set();
    for (const it of S.items) {
      if (!it.location || !(it.status === '판매중' || it.status === '예약중')) continue;
      if (ok && ownerKey(it) !== ok) continue;
      set.add(it.location);
    }
    return [...set].sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
  }
  function filteredItems() {
    const f = S.filter, q = f.q.trim().toLowerCase();
    return S.items.filter(it => {
      const active = it.status === '판매중' || it.status === '예약중';
      if (f.status === 'active' && !active) return false;
      if (f.status === 'soon' && !(active && isSoon(it))) return false;
      if (f.status === '예약중' && it.status !== '예약중') return false;
      if (f.owner === 'shared' && it.owner_user) return false;
      if (f.owner !== 'all' && f.owner !== 'shared' && it.owner_user !== f.owner) return false;
      if (f.loc && f.locOwner && ownerKey(it) !== f.locOwner) return false;
      if (f.loc === '__none' && it.location) return false;
      if (f.loc && f.loc !== '__none' && it.location !== f.loc) return false;
      if (q && !it.title.toLowerCase().includes(q)) return false;
      return true;
    });
  }
  function listBody() {
    const list = filteredItems();
    if (S.filter.status === 'soon') list.sort((a, b) => a.expiry_date.localeCompare(b.expiry_date));
    if (!list.length) {
      return S.items.length
        ? '<p class="empty">조건에 맞는 물건이 없어요</p>'
        : '<p class="empty">아직 재고가 없어요.<br>아래 "당근 연결"에서 판매글을 가져와 주세요.</p>';
    }
    return list.map(it => `
      <button class="item" onclick="App.open(${it.id})">
        ${thumb(it)}
        <div class="grow" style="display:flex; flex-direction:column; gap:4px;">
          <div class="title">${esc(it.title)}</div>
          <div class="muted">${esc(ownerName(it.owner_user))}${it.location ? ' · ' + esc(it.location) : ''} · ${won(it.price)}</div>
          ${it.expiry_date ? `<div class="muted">기한 ${fmtYMD(it.expiry_date)}</div>` : ''}
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;">
          <div class="qty">${it.quantity}개</div>${statusBadge(it)}${expiryBadge(it)}
        </div>
      </button>`).join('');
  }
  function viewList() {
    // 위쪽 숫자는 고른 사람(또는 공금) 물건만 셈. 전체를 고르면 모두
    const f0 = S.filter;
    const mine = it => f0.owner === 'all' || ownerKey(it) === f0.owner;
    const active = S.items.filter(it => mine(it) && (it.status === '판매중' || it.status === '예약중')).length;
    const last = S.members.map(m => m.last_synced_at).filter(Boolean).sort().pop();
    const f = S.filter;
    const owners = [...membersMeFirst().map(m => [m.user_id, m.display_name]), ['shared', '공금'], ['all', '전체']];
    const soonCount = S.items.filter(it => mine(it) && (it.status === '판매중' || it.status === '예약중') && isSoon(it)).length;
    const statuses = [['active', '전체'], ['예약중', '예약중'], ['soon', `기한 임박 ${soonCount}`]];
    const locBtn = (k, v, label) => `<button class="chip ${f.loc === v && (!v || f.locOwner === k) ? 'on' : ''}" data-loc="${esc(v)}" data-owner="${esc(k)}" onclick="App.locFilter(this.dataset.loc, this.dataset.owner)">${esc(label)}</button>`;
    const active2 = it => it.status === '판매중' || it.status === '예약중';
    let locHtml;
    if (f.owner === 'all') {
      // 전체 보기: 사람·공금별로 나눠서
      const keys = [...membersMeFirst().map(m => m.user_id), 'shared'].filter(k => locations(k).length);
      locHtml = keys.length
        ? `<div class="locs">${locBtn('', '', '전체')}</div>` + keys.map(k => `<div class="muted" style="font-size:12px;">${esc(ownerKeyName(k))}</div>
            <div class="locs">${locations(k).map(l => locBtn(k, l, l)).join('')}</div>`).join('')
        : '';
    } else {
      const k = f.owner;
      const locs = locations(k);
      const hasNoLoc = S.items.some(it => active2(it) && ownerKey(it) === k && !it.location);
      locHtml = locs.length
        ? `<div class="locs">${locBtn(k, '', '전체')}${locs.map(l => locBtn(k, l, l)).join('')}${hasNoLoc ? locBtn(k, '__none', '위치 없음') : ''}</div>`
        : '';
    }
    return `<div class="page">
      <div class="top big"><div class="grow"><h1>재고</h1>
        <p class="sub">판매 중 ${active}개${soonCount ? ` · 기한 임박 ${soonCount}개` : ''} · ${last ? ago(last) + ' 동기화' : '당근 연결 전'}</p></div>
        <button class="icon-btn ${S.busy ? 'spin' : ''}" aria-label="두 사람 당근 정보 새로 가져오기" onclick="App.refresh()" ${S.busy ? 'disabled' : ''}>${ICON.sync}</button>
      </div>
      <div class="seg" role="group" aria-label="소유자별 보기">
        ${owners.map(([v, n]) => `<button class="${f.owner === v ? 'on' : ''}" onclick="App.ownerFilter('${v}')">${esc(n)}</button>`).join('')}
      </div>
      <div class="chips">
        ${statuses.map(([v, n]) => `<button class="chip ${f.status === v ? 'on' : ''}" onclick="App.statusFilter('${v}')">${n}</button>`).join('')}
      </div>
      <label class="search">${ICON.search}
        <input type="search" aria-label="물건 이름 검색" placeholder="물건 이름 검색" value="${esc(f.q)}" oninput="App.search(this.value)">
      </label>
      <div class="card" style="padding:12px 14px; gap:8px;">
        <div class="loc-head"><span class="grow">보관 위치로 찾기</span>
          <button class="sq-btn" onclick="App.go('locate')">사진으로 등록</button></div>
        ${locHtml || '<p class="muted" style="margin:0;">물건 상세에서 보관 위치를 정하면 여기서 버튼으로 찾을 수 있어요.</p>'}
      </div>
      <div class="list" id="list">${listBody()}</div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // 화면: 물건 상세
  // ------------------------------------------------------------------
  function photosCard(it) {
    const photos = it.photos || [];
    if (photos.length < 2) return '';
    return `<div class="card">
      <b>대표 사진</b>
      <div class="photos">
        ${photos.map((u, i) => `<button class="${u === it.image_url ? 'on' : ''}" onclick="App.pickPhoto(${it.id}, ${i})" aria-label="${i + 1}번 사진을 대표로">
          <img src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy">${u === it.image_url ? '<span class="tag">대표</span>' : ''}</button>`).join('')}
      </div>
      <p class="muted" style="margin:0;">다른 사진을 누르면 대표 사진이 바뀌어요.</p>
    </div>`;
  }
  function expiryCard(it) {
    const e = expiryInfo(it);
    const head = it.expiry_date
      ? `<div class="row"><div class="grow"><div class="muted">소비기한</div><div style="font-size:22px; font-weight:700;">${fmtYMD(it.expiry_date)}</div></div>
           ${e.expired ? '<span class="badge b-red">기한 지남</span>' : `<span class="badge ${e.soon ? 'b-orange' : 'b-gray'}">D-${e.days}</span>`}</div>`
      : `<div><div class="muted">소비기한</div><div style="font-size:15px; margin-top:4px;">${it.details_fetched_at ? '판매글에서 찾지 못했어요' : '아직 불러오기 전이에요'}</div></div>`;
    return `<form class="card" onsubmit="event.preventDefault(); App.saveExpiry(${it.id}, this)">
      ${head}
      <div class="muted">직접 고치기${it.expiry_manual ? ' · 직접 입력한 기한이에요' : ''}</div>
      <div class="row">
        <input class="input grow" type="date" name="expiry" aria-label="소비기한 날짜" value="${esc(it.expiry_date || '')}">
        <button class="pill blue" type="submit">기한 저장</button>
      </div>
      ${it.expiry_manual ? `<div><button class="pill text" type="button" onclick="App.resetExpiry(${it.id})">판매글 기준으로 되돌리기</button></div>` : ''}
    </form>`;
  }
  function viewDetail() {
    const it = S.items.find(x => x.id === S.itemId);
    if (!it) { S.view = 'list'; return viewList(); }
    const owners = [...membersMeFirst().map(m => [m.user_id, m.display_name]), ['', '공금']];
    return `<div class="page">
      <div class="top"><button class="icon-btn" aria-label="재고 목록으로" onclick="App.go('list')">${ICON.back}</button><h1></h1></div>
      ${it.image_url ? `<img class="hero" src="${esc(it.image_url)}" alt="" referrerpolicy="no-referrer">` : '<div class="hero">사진 없음</div>'}
      <div class="row" style="align-items:flex-start;">
        <div class="grow"><h2 style="margin:0; font-size:22px;">${esc(it.title)}</h2>
          <p class="sub">${won(it.price)}${it.region ? ' · ' + esc(it.region) : ''}</p></div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">${statusBadge(it)}${expiryBadge(it, true)}</div>
      </div>

      ${it.daangn_url ? `<a class="btn sm line" href="${esc(it.daangn_url)}" target="_blank" rel="noopener">당근에서 판매글 보기 ${ICON.out}</a>` : ''}
      ${photosCard(it)}
      ${expiryCard(it)}

      <div class="card">
        <div class="muted">누구 물건인지</div>
        <div class="seg" role="group" aria-label="소유자">
          ${owners.map(([v, n]) => `<button class="${(it.owner_user || '') === v ? 'on' : ''}" onclick="App.setOwner(${it.id}, '${v}')">${esc(n)}</button>`).join('')}
        </div>
        <p class="muted" style="margin:0;">A·B님 물건을 공금으로 넘길 때는 "공금 이동"을 쓰면 기록이 남아요.</p>
      </div>

      <div class="card">
        <div class="row">
          <div class="grow"><div class="muted">남은 수량</div><div style="font-size:24px; font-weight:700;">${it.quantity}개</div></div>
          <div class="stepper">
            <button aria-label="수량 1개 줄이기" onclick="App.setQty(${it.id}, ${it.quantity - 1})" ${it.quantity <= 0 ? 'disabled' : ''}>−</button>
            <button aria-label="수량 1개 늘리기" onclick="App.setQty(${it.id}, ${it.quantity + 1})">+</button>
          </div>
          <button class="sell-btn" onclick="App.sell(${it.id})" ${it.quantity < 1 || S.busy ? 'disabled' : ''}>판매완료</button>
        </div>
        <p class="muted" style="margin:0;">팔았을 때는 "판매완료"를 눌러 주세요. 수량이 1개씩 줄어요. +/− 버튼은 개수를 잘못 셌을 때 고치는 용도예요.</p>
      </div>

      <div class="card">
        <div class="row"><b class="grow">보관 위치</b><span class="muted">${esc(it.location || '정하지 않음')}</span></div>
        <div class="locs">
          ${locations(ownerKey(it)).map(l => `<button class="chip ${it.location === l ? 'on' : ''}" data-loc="${esc(l)}" onclick="App.setLoc(${it.id}, this.dataset.loc)">${esc(l)}</button>`).join('')}
          ${it.location ? `<button class="chip" onclick="App.setLoc(${it.id}, '')">위치 빼기</button>` : ''}
          ${S.addingLoc ? '' : `<button class="chip" aria-label="새 보관 위치 추가" onclick="App.addLocOpen()" style="font-size:18px; font-weight:700;">+</button>`}
        </div>
        ${S.addingLoc ? `<form class="row" onsubmit="event.preventDefault(); App.addLoc(${it.id}, this)">
          <input class="input grow" name="newloc" id="newloc" placeholder="새 위치 이름 (예: 서랍 1층)" aria-label="새 보관 위치">
          <button class="pill blue" type="submit">추가</button>
          <button class="pill text" type="button" onclick="App.addLocClose()">취소</button>
        </form>` : ''}
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // 화면: 당근 연결
  // ------------------------------------------------------------------
  function viewConnect() {
    const cards = S.members.map(m => `<div class="card">
        <div class="row"><b class="grow">${esc(m.display_name)}님 프로필</b>
          ${m.daangn_profile_url ? (m.last_sync_ok === false ? '<span class="badge b-orange">확인 필요</span>' : '<span class="badge b-blue">연결됨</span>') : '<span class="badge b-gray">연결 전</span>'}</div>
        <label class="field">당근 프로필 링크
          <input class="input" id="link-${m.user_id}" placeholder="https://www.daangn.com/u/..." value="${esc(m.daangn_profile_url || '')}"></label>
        <button class="btn sm" onclick="App.sync('${m.user_id}')" ${S.busy ? 'disabled' : ''}>가져오기</button>
      </div>`).join('');

    const runRow = r => {
      const d = new Date(r.started_at);
      return `<div style="display:flex; flex-direction:column; gap:2px; padding:8px 0; border-top:1px solid var(--line);">
        <div class="muted">${fmtDate(r.started_at)} ${d.toTimeString().slice(0, 5)} · ${esc(ownerName(r.member))}</div>
        <div style="font-size:14px; ${r.ok === false ? 'color: var(--red);' : ''}">${esc(r.message || '')}</div>
      </div>`;
    };

    return `<div class="page">
      <div class="top"><h1>당근 연결</h1></div>
      <p class="muted" style="margin:0; line-height:1.6;">당근 앱 › 나의 당근 › 내 프로필 › 공유 › 링크 복사 후 붙여넣고 "가져오기"를 누르세요.</p>
      ${S.members.length < 2 ? '<div class="card"><span class="muted">아직 한 분만 가입했어요. 다른 한 분도 가입하면 여기에 함께 보여요.</span></div>' : ''}
      ${cards}
      <div class="card" style="gap:0;"><b style="padding-bottom:8px;">최근 동기화 기록</b>
        ${S.runs.length ? S.runs.map(runRow).join('') : '<div class="muted" style="padding-top:8px; border-top:1px solid var(--line);">아직 기록이 없어요</div>'}
      </div>
      <div class="card"><div class="muted">${esc(S.me.display_name)}님으로 로그인 중 · ${esc(S.me.email)}</div>
        <button class="btn sm line" onclick="App.logout()">로그아웃</button></div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // 화면: 공금 이동
  // ------------------------------------------------------------------
  function viewMove() {
    const q = S.moveQ.trim().toLowerCase();
    const list = S.items.filter(it => it.owner_user && it.quantity > 0 && it.status === '판매중'
      && (!q || `${it.title} ${it.location || ''}`.toLowerCase().includes(q))).slice(0, 60);
    const rows = list.map(it => {
      const n = Math.min(S.moveQty[it.id] || 1, it.quantity);
      return `<div class="card" style="padding:12px;">
        <div class="row">${thumb(it)}<div class="grow"><div class="title">${esc(it.title)}</div>
          <div class="muted">${esc(ownerName(it.owner_user))} → <b style="color:var(--blue-ink)">공금</b> · 보유 ${it.quantity}개</div></div></div>
        <div class="row">
          <div class="stepper">
            <button aria-label="옮길 수량 줄이기" onclick="App.moveQty(${it.id}, ${n - 1}, ${it.quantity})">−</button>
            <span>${n}</span>
            <button aria-label="옮길 수량 늘리기" onclick="App.moveQty(${it.id}, ${n + 1}, ${it.quantity})">+</button>
          </div>
          <button class="btn sm grow" onclick="App.move(${it.id}, ${n})" ${S.busy ? 'disabled' : ''}>${n}개 공금으로</button>
        </div>
      </div>`;
    }).join('');
    const monthTotal = S.transfers.reduce((a, t) => a + t.quantity, 0);
    return `<div class="page">
      <div class="top"><h1>공금으로 옮기기</h1></div>
      <label class="search">${ICON.search}
        <input type="search" aria-label="옮길 물건 검색" placeholder="옮길 물건 검색" value="${esc(S.moveQ)}" oninput="App.moveSearch(this.value)">
      </label>
      <div class="list" id="movelist">${rows || '<p class="empty">옮길 수 있는 A·B님 물건이 없어요</p>'}</div>
      <div class="card"><b>이번 달 옮긴 물건 ${monthTotal}개</b>
        ${S.transfers.map(t => `<div class="muted">${fmtDate(t.moved_at)} · ${esc(t.title)} ${t.quantity}개 (${esc(ownerName(t.from_user))} → 공금)</div>`).join('') || '<div class="muted">아직 없어요</div>'}
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // 화면: 사진으로 보관 위치 한 번에 정하기
  // ------------------------------------------------------------------
  function locateSearchHtml() {
    const L = S.locate, q = L.q.trim().toLowerCase();
    if (!q) return '';
    const res = S.items.filter(it => (it.status === '판매중' || it.status === '예약중') && it.quantity > 0
      && ownerKey(it) === locOwner() && !L.list.includes(it.id) && it.title.toLowerCase().includes(q)).slice(0, 8);
    if (!res.length) return '<p class="muted" style="margin:0;">찾는 물건이 없어요</p>';
    return res.map(it => `<button class="pick-row" onclick="App.locAdd(${it.id})">
      ${thumb(it)}<div class="grow"><div class="title">${esc(it.title)}</div>
      <div class="muted">${esc(ownerName(it.owner_user))}${it.location ? ' · 지금 ' + esc(it.location) : ''}</div></div>
      <span class="pill">추가</span></button>`).join('');
  }
  function locOwner() { return S.locate.owner || (S.me && S.me.user_id) || 'shared'; }
  function viewLocate() {
    const L = S.locate;
    const ok = locOwner();
    const locs = locations(ok);
    const ownerOpts = [...membersMeFirst().map(m => [m.user_id, m.display_name]), ['shared', '공금']];
    const placeBtn = l => `<button class="chip ${L.place === l ? 'on' : ''}" data-loc="${esc(l)}" onclick="App.locPlace(this.dataset.loc)">${esc(l)}</button>`;
    const rows = L.list.map(id => {
      const it = S.items.find(x => x.id === id);
      if (!it) return '';
      const on = L.sel.includes(id);
      return `<button class="pick-row ${on ? 'on' : ''}" onclick="App.locToggle(${id})" aria-pressed="${on}">
        <span class="check">${on ? '✓' : ''}</span>${thumb(it)}
        <div class="grow"><div class="title">${esc(it.title)}</div>
        <div class="muted">${esc(ownerName(it.owner_user))} · ${it.location ? '지금 ' + esc(it.location) : '위치 없음'}</div></div></button>`;
    }).join('');
    return `<div class="page">
      <div class="top"><button class="icon-btn" aria-label="재고 목록으로" onclick="App.go('list')">${ICON.back}</button><h1>사진으로 보관 위치 정하기</h1></div>

      <div class="card">
        <b>1. 누구 물건 보관 위치인지</b>
        <div class="seg" role="group" aria-label="누구 물건">
          ${ownerOpts.map(([v, n]) => `<button class="${ok === v ? 'on' : ''}" onclick="App.locOwnerSet('${v}')">${esc(n)}</button>`).join('')}
        </div>
        <p class="muted" style="margin:0;">보관 위치는 ${esc(ownerKeyName(ok))} 물건끼리만 따로 관리돼요. 사진에서도 ${esc(ownerKeyName(ok))} 물건만 찾아요.</p>
      </div>

      <div class="card">
        <b>2. 보관 위치</b>
        ${locs.length ? `<div class="locs">${locs.map(placeBtn).join('')}</div>` : ''}
        <form class="row" onsubmit="event.preventDefault(); App.locNewPlace(this)">
          <input class="input grow" name="place" placeholder="새 위치 입력 (예: 서랍 1층)" aria-label="새 보관 위치">
          <button class="pill blue" type="submit">선택</button>
        </form>
        ${L.place ? `<div class="muted">선택한 위치: <b style="color:var(--ink)">${esc(L.place)}</b></div>` : ''}
      </div>

      <div class="card">
        <b>3. 같은 곳에 둘 물건을 모아 찍기</b>
        <p class="muted" style="margin:0;">물건 이름이 보이게 앞면이 나오도록 찍어 주세요. 앨범에서 골라도 돼요.</p>
        <label class="btn sm ${S.busy ? 'line' : ''}" style="cursor:pointer;">
          <input type="file" accept="image/*" style="display:none" onchange="App.locPhoto(this)" ${S.busy ? 'disabled' : ''}>
          ${S.busy ? 'AI가 물건을 찾는 중이에요…' : (L.photo ? '다시 찍기' : '사진 찍기 / 고르기')}
        </label>
        ${L.photo ? `<img class="preview" src="${L.photo}" alt="찍은 사진">` : ''}
        ${L.error ? `<p class="err" style="margin:0;">${esc(L.error)}</p>` : ''}
      </div>

      ${L.matched ? `<div class="card">
        <b>4. 확인하고 저장</b>
        <p class="muted" style="margin:0;">${L.list.length ? '사진에서 찾은 물건이에요. 아닌 건 눌러서 빼 주세요.' : '사진에서 재고 물건을 찾지 못했어요. 아래에서 직접 추가해 주세요.'}</p>
        <div class="list">${rows}</div>
        ${L.unknown.length ? `<p class="muted" style="margin:0;">재고에서 못 찾은 물건: ${L.unknown.map(esc).join(', ')}</p>` : ''}
        <label class="search">${ICON.search}
          <input type="search" aria-label="빠진 물건 검색" placeholder="빠진 물건 이름으로 추가" value="${esc(L.q)}" oninput="App.locSearch(this.value)">
        </label>
        <div class="list" id="locsearch">${locateSearchHtml()}</div>
        <button class="btn" onclick="App.locSave()" ${!L.place || !L.sel.length || S.busy ? 'disabled' : ''}>
          ${L.place ? `선택한 ${L.sel.length}개를 '${esc(L.place)}'에 저장` : '먼저 보관 위치를 골라 주세요'}</button>
      </div>` : ''}
    </div>`;
  }

  // 사진을 긴 변 1600px 이하 JPEG 로 줄여서 보냄 (업로드 시간·AI 사용량 줄이기)
  function resizeImage(file, max = 1600, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열지 못했어요')); };
      img.src = url;
    });
  }

  // ------------------------------------------------------------------
  // 그리기
  // ------------------------------------------------------------------
  function nav() {
    const tabs = [['list', '재고', ICON.box], ['move', '공금 이동', ICON.move], ['connect', '당근 연결', ICON.sync]];
    const cur = (S.view === 'detail' || S.view === 'locate') ? 'list' : S.view;
    return `<nav class="bottom" aria-label="하단 메뉴"><div class="in">
      ${tabs.map(([v, n, i]) => `<button class="${cur === v ? 'on' : ''}" onclick="App.go('${v}')" ${cur === v ? 'aria-current="page"' : ''}>${i}${n}</button>`).join('')}
    </div></nav>`;
  }
  function render() {
    if (!S.session || !S.me) { $app.innerHTML = viewAuth(); return; }
    const v = { list: viewList, detail: viewDetail, connect: viewConnect, move: viewMove, locate: viewLocate }[S.view] || viewList;
    $app.innerHTML = v() + nav();
  }

  // ------------------------------------------------------------------
  // 동작
  // ------------------------------------------------------------------
  async function withBusy(fn) {
    if (S.busy) return;
    S.busy = true; render();
    try { await fn(); } catch (e) { toast(errMsg(e)); }
    finally { S.busy = false; render(); }
  }
  async function patchItem(id, patch) {
    const { data, error } = await sb.from('inv_items').update(patch).eq('id', id).select().single();
    if (error) throw error;
    const i = S.items.findIndex(x => x.id === id);
    if (i >= 0) S.items[i] = data;
  }

  window.App = {
    authTab(t) { S.authTab = t; S.authErr = ''; S.authMsg = ''; render(); },
    async login(form) {
      S.authErr = ''; S.authMsg = '';
      const email = form.email.value.trim(), password = form.password.value;
      S.busy = true; render();
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      S.busy = false;
      if (error) { S.authErr = errMsg(error); return render(); }
      S.session = data.session;
      await afterLogin();
    },
    async signup(form) {
      S.authErr = ''; S.authMsg = '';
      const name = form.name.value.trim(), email = form.email.value.trim(), password = form.password.value;
      if (name.replace(/\s/g, '').length < 2) { S.authErr = '이름을 두 글자 이상 입력해 주세요'; return render(); }
      S.busy = true; render();
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: name }, emailRedirectTo: location.origin + location.pathname },
      });
      S.busy = false;
      if (error) { S.authErr = errMsg(error); return render(); }
      if (data.session) { S.session = data.session; return afterLogin(); }
      S.authTab = 'login';
      S.authMsg = '가입 메일을 보냈어요. 메일함에서 인증 링크를 누른 뒤 여기서 로그인해 주세요.';
      render();
    },
    async logout() { await sb.auth.signOut(); },

    go(view) {
      S.view = view; window.scrollTo(0, 0); render();
      if (view === 'connect') loadRuns();
      if (view === 'move') loadTransfers();
    },
    open(id) { S.itemId = id; S.view = 'detail'; S.addingLoc = false; window.scrollTo(0, 0); render(); },
    // 홈 새로고침: 두 사람 당근 프로필을 모두 가져와 동기화
    async refresh() {
      if (S.busy) return;
      toast('당근에서 가져오는 중이에요…');
      await withBusy(async () => {
        const { data, error } = await sb.functions.invoke('daangn-sync', { body: {} });
        if (error) {
          let msg = errMsg(error);
          try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
          await loadAll();
          toast(msg);
          return;
        }
        await loadAll();
        loadRuns();
        const rs = (data && data.results) || [];
        const failed = rs.filter(r => r.ok === false && !/링크가 아직/.test(r.message || ''));
        const noLink = rs.filter(r => /링크가 아직/.test(r.message || ''));
        if (failed.length) toast(`${failed.map(r => r.member).join(', ')}님 가져오기에 문제가 있어요. 당근 연결에서 기록을 확인해 주세요`);
        else if (noLink.length === rs.length) toast('당근 연결에서 프로필 링크를 먼저 넣어 주세요');
        else toast('당근 정보를 가져왔어요');
      });
    },
    search(v) { S.filter.q = v; document.getElementById('list').innerHTML = listBody(); },
    ownerFilter(v) { S.filter.owner = v; S.filter.loc = ''; S.filter.locOwner = ''; render(); },
    statusFilter(v) { S.filter.status = v; render(); },
    locFilter(v, k) { S.filter.loc = v || ''; S.filter.locOwner = v ? (k || '') : ''; render(); },
    setLoc(id, v) {
      withBusy(async () => {
        await patchItem(id, { location: v || null });
        toast(v ? `보관 위치: ${v}` : '보관 위치를 뺐어요');
      });
    },
    addLocOpen() {
      S.addingLoc = true; render();
      const el = document.getElementById('newloc'); if (el) el.focus();
    },
    addLocClose() { S.addingLoc = false; render(); },
    addLoc(id, form) {
      const v = form.newloc.value.trim();
      if (!v) return;
      S.addingLoc = false;
      withBusy(async () => {
        await patchItem(id, { location: v });
        toast(`보관 위치: ${v}`);
      });
    },

    setOwner(id, uid) {
      const it = S.items.find(x => x.id === id);
      if (!it || (it.owner_user || '') === (uid || '')) return;
      // 보관 위치는 사람·공금별로 따로라서, 주인이 바뀌면 위치를 비움
      const hadLoc = !!it.location;
      withBusy(async () => {
        await patchItem(id, { owner_user: uid || null, location: null });
        if (hadLoc) toast('주인이 바뀌어서 보관 위치를 비웠어요');
      });
    },
    setQty(id, q) {
      if (q < 0) return;
      withBusy(async () => {
        const it = S.items.find(x => x.id === id);
        const patch = { quantity: q };
        if (q === 0 && it && it.status !== '판매완료') patch.status = '판매완료';
        if (q > 0 && it && it.status === '판매완료') patch.status = '판매중';
        await patchItem(id, patch);
      });
    },
    pickPhoto(id, idx) {
      const it = S.items.find(x => x.id === id);
      if (!it || !it.photos || !it.photos[idx]) return;
      withBusy(async () => {
        await patchItem(id, { image_url: it.photos[idx], image_locked: true, photo_pick: 'manual' });
        toast('대표 사진을 바꿨어요');
      });
    },
    saveExpiry(id, form) {
      const v = form.expiry.value || null;
      withBusy(async () => {
        await patchItem(id, { expiry_date: v, expiry_manual: true });
        toast(v ? '소비기한을 저장했어요' : '소비기한을 지웠어요');
      });
    },
    resetExpiry(id) {
      withBusy(async () => {
        await patchItem(id, { expiry_manual: false, details_fetched_at: null });
        toast('다음 동기화 때 판매글 기준으로 다시 불러와요');
      });
    },
    sell(id) {
      withBusy(async () => {
        const { data, error } = await sb.rpc('inv_sell', { p_item_id: id, p_qty: 1 });
        if (error) throw error;
        const i = S.items.findIndex(x => x.id === id);
        if (i >= 0) S.items[i] = data;
        toast(data.quantity === 0 ? '판매완료! 재고에서 빠졌어요' : `1개 판매 · ${data.quantity}개 남았어요`);
        if (data.quantity === 0) S.view = 'list';
      });
    },

    sync(memberId) {
      // 화면을 다시 그리기 전에 입력칸 값을 먼저 읽어 둠
      const body = { member_id: memberId };
      const input = document.getElementById('link-' + memberId);
      const m = S.members.find(x => x.user_id === memberId);
      const link = input ? input.value.trim() : '';
      if (!link && !m.daangn_profile_url) { toast('당근 프로필 링크를 붙여넣어 주세요'); return; }
      if (link && link !== m.daangn_profile_url) body.profile_url = link;
      withBusy(async () => {
        const { data, error } = await sb.functions.invoke('daangn-sync', { body });
        if (error) {
          let msg = errMsg(error);
          try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
          toast(msg);
          return;
        }
        await loadAll();
        await loadRuns();
        const r = (data.results || [])[0];
        toast(r && r.ok === false ? '가져오지 못했어요. 아래 기록을 확인해 주세요' : '가져왔어요');
      });
    },

    locOwnerSet(v) {
      // 주인을 바꾸면 위치·찾은 결과를 처음부터
      S.locate = { owner: v, place: '', photo: '', list: [], sel: [], unknown: [], matched: false, error: '', q: '' };
      render();
    },
    locPlace(v) { S.locate.place = v; render(); },
    locNewPlace(form) {
      const v = form.place.value.trim();
      if (!v) return;
      S.locate.place = v; render();
    },
    async locPhoto(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const L = S.locate;
      L.error = '';
      try { L.photo = await resizeImage(file); } catch (e) { L.error = errMsg(e); render(); return; }
      await withBusy(async () => {
        const { data, error } = await sb.functions.invoke('daangn-sync', {
          body: { action: 'match_photo', image: L.photo.split(',')[1], mime: 'image/jpeg', owner: locOwner() },
        });
        if (error) {
          let msg = errMsg(error);
          try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
          L.error = msg;
          return;
        }
        // 같은 판매글을 나눠 가진 줄(공금으로 옮긴 몫 등)도 함께
        const ids = new Set(data.ids || []);
        for (const id of [...ids]) {
          const it = S.items.find(x => x.id === id);
          if (it && it.daangn_article_id) S.items.forEach(x => {
            if (x.daangn_article_id === it.daangn_article_id && ownerKey(x) === locOwner() && x.quantity > 0 && (x.status === '판매중' || x.status === '예약중')) ids.add(x.id);
          });
        }
        L.list = [...ids].filter(id => S.items.some(x => x.id === id && ownerKey(x) === locOwner()));
        L.sel = [...L.list];
        L.unknown = data.unknown || [];
        L.matched = true;
        L.q = '';
      });
    },
    locToggle(id) {
      const L = S.locate;
      L.sel = L.sel.includes(id) ? L.sel.filter(x => x !== id) : [...L.sel, id];
      render();
    },
    locSearch(v) { S.locate.q = v; const el = document.getElementById('locsearch'); if (el) el.innerHTML = locateSearchHtml(); },
    locAdd(id) {
      const L = S.locate;
      if (!L.list.includes(id)) L.list.push(id);
      if (!L.sel.includes(id)) L.sel.push(id);
      L.q = '';
      render();
    },
    locSave() {
      const L = S.locate;
      if (!L.place || !L.sel.length) return;
      const place = L.place, ids = [...L.sel];
      withBusy(async () => {
        const { error } = await sb.from('inv_items').update({ location: place }).in('id', ids);
        if (error) throw error;
        await loadItems();
        const ok = locOwner();
        S.locate = { owner: '', place: '', photo: '', list: [], sel: [], unknown: [], matched: false, error: '', q: '' };
        S.filter.owner = ok;
        S.filter.loc = place;
        S.filter.locOwner = ok;
        S.view = 'list';
        toast(`${ids.length}개를 '${place}'에 저장했어요`);
      });
    },

    moveSearch(v) { S.moveQ = v; const el = document.getElementById('movelist'); const tmp = document.createElement('div'); tmp.innerHTML = viewMove(); el.replaceWith(tmp.querySelector('#movelist')); },
    moveQty(id, n, max) { S.moveQty[id] = Math.max(1, Math.min(n, max)); render(); },
    move(id, n) {
      withBusy(async () => {
        const { error } = await sb.rpc('inv_move_to_shared', { p_item_id: id, p_qty: n });
        if (error) throw error;
        delete S.moveQty[id];
        await Promise.all([loadItems(), loadTransfers()]);
        toast(`${n}개를 공금으로 옮겼어요`);
      });
    },

  };

  async function loadRuns() {
    const { data } = await sb.from('inv_sync_runs').select('*').order('started_at', { ascending: false }).limit(1);
    S.runs = data || [];
    if (S.view === 'connect') render();
  }
  async function loadTransfers() {
    const start = monthStart(new Date());
    const { data } = await sb.from('inv_transfers').select('*').gte('moved_at', start.toISOString()).order('moved_at', { ascending: false });
    S.transfers = data || [];
    if (S.view === 'move') render();
  }

  // ------------------------------------------------------------------
  // 시작
  // ------------------------------------------------------------------
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') { S.session = null; S.me = null; render(); }
  });
  sb.auth.getSession().then(async ({ data }) => {
    S.session = data.session;
    if (S.session) await afterLogin(); else render();
  });
})();
</script>
</body>
